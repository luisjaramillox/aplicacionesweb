<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi tienda</title>
  <style>
    /* ---- general ---- */
    body {
      font-family: Arial, sans-serif;
      color: #222222;
      background-color: #f0f0f0;
      line-height: 1.5;
      margin: 0;
    }

    h1 { font-size: 2rem; }
    h2 { font-size: 1.5rem; color: #1e3a5f; }

    /* ---- cabecera y menu ---- */
    header {
      background-color: #1e3a5f;
      color: white;
      padding: 1rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 0.5rem;
    }

    nav a:hover {
      background-color: #c2410c;
    }

    /* ---- contenido ---- */
    main { padding: 1rem; }

    .producto {
      background-color: white;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .precio {
      color: #c2410c;
      font-weight: bold;
    }

    /* ---- formulario ---- */
    input, textarea {
      font-family: inherit;
      font-size: 1rem;
    }

    input:focus, textarea:focus {
      outline: 3px solid #c2410c;
    }

    /* ---- pie ---- */
    footer {
      background-color: #1e3a5f;
      color: white;
      padding: 1rem;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mi tienda</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>

  <main>
    <h2>Productos</h2>
    <article class="producto">
      <h3>Portátil 15"</h3>
      <p>8 núcleos y 16 GB de RAM por <span class="precio">699 €</span></p>
    </article>
    <article class="producto">
      <h3>Monitor 27"</h3>
      <p>Pantalla IPS por <span class="precio">249 €</span></p>
    </article>

    <h2>Contacto</h2>
    <form action="#">
      <p>
        <label for="nombre">Nombre</label><br>
        <input type="text" id="nombre" name="nombre">
      </p>
      <p>
        <label for="correo">Correo</label><br>
        <input type="email" id="correo" name="correo">
      </p>
      <p>
        <label for="mensaje">Mensaje</label><br>
        <textarea id="mensaje" name="mensaje"></textarea>
      </p>
      <button type="submit">Enviar</button>
    </form>
  </main>

  <footer>
    <p>© 2026 Mi tienda</p>
  </footer>
</body>
</html>
